services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schoolcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolcom_dev}
      POSTGRES_DB: ${POSTGRES_DB:-schoolcom}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolcom} -d ${POSTGRES_DB:-schoolcom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-schoolcom}
      DB_USER: ${POSTGRES_USER:-schoolcom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-schoolcom_dev}
      ConnectionStrings__Redis: "redis:6379"
      Cors__Origins__0: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_API_URL: http://api:8080
      COOKIE_SECURE: "false"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
